name: hesabati
description: تطبيق حساباتي - إدارة حسابات العملاء
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Charts
  fl_chart: ^0.68.0

  # PDF & Export
  pdf: ^3.11.0
  printing: ^5.13.1

  # Sharing
  share_plus: ^9.0.0
  url_launcher: ^6.3.0

  # Storage
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  file_picker: ^8.0.6

  # Media
  image_picker: ^1.1.2

  # Security
  local_auth: ^2.3.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  timezone: ^0.9.4

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
